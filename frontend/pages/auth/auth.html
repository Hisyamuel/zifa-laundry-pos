<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Autentikasi Staf - Zifa Laundry</title>
    <link rel="icon" href="/frontend/public/images/zifa-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/frontend/css/variables.css">
    <link rel="stylesheet" href="/frontend/css/component.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.5 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("/frontend/public/images/jemuran.jpeg") no-repeat center center fixed;
            background-size: cover;
            opacity: 0.2;
            z-index: -1;
        }

        .au {
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;
            background: var(--bg);
            opacity: 100%;
            border-radius: 16px;
            border: 1px solid var(--ln);
        }

        .au .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 24px;
        }

        .au .logo i {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--grad);
            color: var(--on);
            display: grid;
            place-items: center;
            font-style: normal;
        }

        .au h1 {
            text-align: center;
            font-size: 24px;
            margin: 0 0 8px;
        }

        .au p {
            text-align: center;
            color: var(--mu);
            margin: 0 0 24px;
        }

        .seg-auth {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .seg-auth>div {
            display: inline-flex;
            border: 1px solid var(--ln);
            border-radius: 10px;
            background: var(--sf);
            padding: 3px;
            gap: 2px;
        }

        .seg-auth button {
            border: 0;
            background: none;
            color: var(--mu);
            padding: 7px 20px;
            border-radius: 7px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .seg-auth button.on {
            background: var(--ink);
            color: var(--on);
        }

        /* Styling Error Inline di Bawah Input */
        .err-msg {
            display: none;
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 4px;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        .err-msg.active {
            display: block;
        }

        .form-slider-wrapper {
            overflow: hidden;
            width: 100%;
            transition: height 0.4s ease-in-out;
        }

        /* Track untuk menempatkan kedua form secara sejajar (horizontal) */
        .form-slider-track {
            display: flex;
            width: 200%;
            transition: transform 0.4s ease-in-out;
            align-items: flex-start;
        }

        .form-section {
            width: 50%;
            box-sizing: border-box;
            transition: opacity 0.4s ease;
        }

        /* Mengunci form yang tidak aktif agar tidak bisa diklik lewat tab */
        .form-section:not(.active) {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }

        .btn-link {
            border: none;
            background: none;
            cursor: pointer;
            font: inherit;
            padding: 0;
            color: var(--ink);
            text-decoration: none;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .btn-link {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="au loader">
        <div class="logo"><i>Z</i>Zifa Laundry</div>

        <h1 id="auth-title">Masuk staf</h1>
        <p id="auth-subtitle">Khusus Owner dan Employee.</p>

        <div class="seg-auth">
            <div>
                <button class="on" id="tab-login">Masuk</button>
                <button id="tab-register">Daftar</button>
            </div>
        </div>

        <div class="form-slider-wrapper">
            <div class="form-slider-track" id="form-track">
                <!-- FORM LOGIN -->
                <form id="form-login" class="form-section active">
                    <label class="f">
                        Masuk sebagai
                        <select id="login-role" required>
                            <option value="" selected>-- Pilih Status --</option>
                            <option value="owner">Owner</option>
                            <option value="employee">Employee (Kasir)</option>
                        </select>
                    </label>
                    <div class="err-msg" id="err-login-role"></div>

                    <label class="f">
                        Email
                        <input type="email" id="login-email" placeholder="nama@email.com" required>
                    </label>
                    <div class="err-msg" id="err-login-email"></div>

                    <label class="f">
                        Kata sandi
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </label>
                    <div class="err-msg" id="err-login-password"></div>

                    <button type="submit" class="b p w" style="margin-top: 10px;">Masuk</button>

                    <p style="font-size: 12px; margin-top: 16px;">
                        Employee yang masih menunggu persetujuan belum bisa masuk.
                    </p>

                    <a class="btn-link" href="/frontend/index.html">← Kembali ke Beranda</a>
                </form>

                <!-- FORM REGISTER -->
                <form id="form-register" class="form-section">
                    <label class="f">
                        Nama lengkap (Wajib diawali Huruf Kapital)
                        <input type="text" id="reg-name" placeholder="Misal: Samuel Budi" required minlength="3">
                    </label>
                    <div class="err-msg" id="err-reg-name"></div>

                    <label class="f">
                        Email
                        <input type="email" id="reg-email" placeholder="nama@email.com" required>
                    </label>
                    <div class="err-msg" id="err-reg-email"></div>

                    <label class="f">
                        No. telepon
                        <!-- Regex HTML5 di pattern: hanya angka 10-13 digit -->
                        <input type="tel" id="reg-phone" placeholder="08xx xxxx xxxx" required pattern="^[0-9]{10,13}$">
                    </label>
                    <div class="err-msg" id="err-reg-phone"></div>

                    <label class="f">
                        Kata sandi
                        <input type="password" id="reg-password" placeholder="Minimal 8 karakter" required
                            minlength="8">
                    </label>
                    <div class="err-msg" id="err-reg-password"></div>

                    <label class="f">
                        Konfirmasi kata sandi
                        <input type="password" id="reg-password-confirm" placeholder="Ketik ulang kata sandi" required
                            minlength="8">
                    </label>
                    <div class="err-msg" id="err-reg-confirm"></div>

                    <button type="submit" class="b p w" style="margin-top: 10px;">Buat akun</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/frontend/js/pages/auth/auth.js"></script>
</body>

</html>
